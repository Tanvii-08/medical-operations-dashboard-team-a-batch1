<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Service Coverage Map | Medical Operations Dashboard</title>
    <meta name="description" content="Interactive healthcare service coverage map with filters by department, time period, and service type for medical operations intelligence.">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Header -->
    <header id="app-header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div class="header-titles">
                    <h1>Service Coverage Map</h1>
                    <p class="header-subtitle">Medical Operations Intelligence Dashboard</p>
                </div>
            </div>
            <div class="header-right">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span>Live Data</span>
                </div>
                <div class="stats-pill" id="header-stats-pill">
                    <span id="active-departments-count">20</span> Departments
                    <span class="pill-divider">|</span>
                    <span id="active-doctors-count">500</span> Doctors
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main id="app-main">
        <!-- Sidebar Filters -->
        <aside id="filters-panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Filters
                </h2>
                <button id="btn-reset-filters" class="btn-ghost" title="Reset all filters">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    Reset
                </button>
            </div>

            <!-- Department Filter -->
            <div class="filter-group">
                <label class="filter-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Department
                </label>
                <div class="select-wrapper">
                    <select id="filter-department" class="filter-select">
                        <option value="all">All Departments</option>
                    </select>
                </div>
            </div>

            <!-- Service Type Filter -->
            <div class="filter-group">
                <label class="filter-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
                        <circle cx="20" cy="10" r="2"/>
                    </svg>
                    Service Type (Specialization)
                </label>
                <div class="select-wrapper">
                    <select id="filter-service-type" class="filter-select">
                        <option value="all">All Services</option>
                    </select>
                </div>
            </div>

            <!-- Time Period Filter -->
            <div class="filter-group">
                <label class="filter-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Time Period
                </label>
                <div class="select-wrapper">
                    <select id="filter-time-period" class="filter-select">
                        <option value="all">All Time</option>
                        <option value="q1">Q1 (Jan-Mar)</option>
                        <option value="q2">Q2 (Apr-Jun)</option>
                        <option value="q3">Q3 (Jul-Sep)</option>
                        <option value="q4">Q4 (Oct-Dec)</option>
                    </select>
                </div>
            </div>

            <!-- Experience Range Filter -->
            <div class="filter-group">
                <label class="filter-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>
                    </svg>
                    Experience Level
                </label>
                <div class="select-wrapper">
                    <select id="filter-experience" class="filter-select">
                        <option value="all">All Levels</option>
                        <option value="junior">Junior (1-5 yrs)</option>
                        <option value="mid">Mid-Level (6-15 yrs)</option>
                        <option value="senior">Senior (16-25 yrs)</option>
                        <option value="expert">Expert (25+ yrs)</option>
                    </select>
                </div>
            </div>

            <!-- Divider -->
            <div class="filter-divider"></div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <h3 class="stats-title">Coverage Summary</h3>
                <div class="stat-item">
                    <div class="stat-icon" style="--accent: #6366f1;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-departments">20</span>
                        <span class="stat-label">Active Facilities</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="--accent: #06b6d4;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-doctors">500</span>
                        <span class="stat-label">Medical Staff</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="--accent: #f59e0b;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-specializations">20</span>
                        <span class="stat-label">Specializations</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="--accent: #10b981;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-coverage">100%</span>
                        <span class="stat-label">Area Coverage</span>
                    </div>
                </div>
            </div>

            <!-- Map Legend -->
            <div class="map-legend">
                <h3 class="stats-title">Map Legend</h3>
                <div class="legend-items" id="legend-items">
                    <!-- Generated dynamically -->
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <section id="map-section">
            <div id="map-container">
                <div id="map"></div>
            </div>

            <!-- Bottom Info Bar -->
            <div id="bottom-bar">
                <div class="bar-cards" id="department-cards">
                    <!-- Generated dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- Leaflet Heat -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
