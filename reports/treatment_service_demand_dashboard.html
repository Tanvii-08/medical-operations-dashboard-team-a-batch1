<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Treatment & Service Demand Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .dashboard {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            margin: 3px;
            font-size: 24px;
        }

        .header p {
            margin: 3px;
            font-size: 13px;
        }

        .kpi {
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            width: 100%;
            height: 190px;
            padding: 0;
            overflow: hidden;
        }

        .kpi .plotly-graph-div {
            width: 100% !important;
            height: 190px !important;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .chart {
            background: white;
            border-radius: 8px;
            width: 100%;
            height: 300px;
            padding: 2px;
            overflow: visible;
        }

        .chart .plotly-graph-div {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 900px) {

            .header h1 {
                font-size: 20px;
            }

            .charts {
                grid-template-columns: 1fr;
            }

            .chart {
                height: 300px;
            }

            .kpi {
                height: 190px;
            }

            .kpi .plotly-graph-div {
                height: 190px !important;
            }

        }

    </style>

</head>
